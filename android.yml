name: Android - instalable de prueba

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Ajustes de Android
        run: node scripts/patch-android.mjs

      - name: Ícono y pantalla de inicio
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Copiar la web a la app
        run: npx cap sync android

      - name: Compilar el instalable de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar el instalable
        uses: actions/upload-artifact@v4
        with:
          name: eco-de-colores-instalable-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
